name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Write scopes live at JOB level (Scorecard Token-Permissions: workflow-level
# write grants every job — current and future — the elevated token).
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating GitHub Releases
      id-token: write # for PyPI Trusted Publishing (OIDC)
    outputs:
      prerelease: ${{ steps.tag_kind.outputs.prerelease }}
    environment:
      name: pypi
      url: https://pypi.org/p/gflow-cli
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # This is the one workflow that publishes artefacts (PyPI + GitHub
          # Release), so it must not restore a cache any other workflow can
          # write: a poisoned entry would reach a signed release. Releases are
          # rare; the cold resolve costs seconds (zizmor: cache-poisoning).
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag is signed
        run: |
          TAG=${GITHUB_REF_NAME}
          # Lightweight tags resolve directly to a commit, not a tag object.
          TYPE=$(git cat-file -t "$TAG")
          if [ "$TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Use 'git tag -s' to create a signed annotated tag."
            exit 1
          fi
          # Annotated but unsigned tags have no signature header in the object.
          if ! git cat-file -p "$TAG" | grep -qE "BEGIN (PGP|SSH) SIGNATURE"; then
            echo "::error::$TAG is not signed. Use 'git tag -s' when cutting releases."
            exit 1
          fi

      - name: Verify tag matches pyproject version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PROJ_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$PROJ_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match pyproject.toml version ($PROJ_VERSION)"
            exit 1
          fi

      - name: Classify the tag
        # Single source of truth for prerelease-ness. It gates BOTH the GitHub Release
        # flag and whether the MCP Registry publish runs at all; as two copies of the
        # same four-clause expression those would eventually disagree.
        #   - semver suffixes:  v1.2.3-alpha1, v1.2.3-rc1, v1.2.3-beta1  (any '-')
        #   - PEP 440 suffixes: v1.2.3a1, v1.2.3b1, v1.2.3rc1            (any a / b / rc)
        # Stable tags like v1.2.3 contain none of these.
        id: tag_kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-*|*a*|*b*|*rc*) prerelease=true ;;
            *)                prerelease=false ;;
          esac
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "${TAG} -> prerelease=${prerelease}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No api-token needed — uses OIDC Trusted Publishing.
        # Configure once at https://pypi.org/manage/account/publishing/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: dist/*
          prerelease: ${{ steps.tag_kind.outputs.prerelease == 'true' }}

  mcp-registry:
    # The registry listing is part of the release, not a follow-up, so it is CALLED here
    # rather than triggered by the Release above. `on: release: published` never fired
    # once: the Release is created with the default GITHUB_TOKEN, and GitHub starts no
    # workflow runs from GITHUB_TOKEN-created events (#841). A user PAT would fix that
    # and add a 366-day expiry to a path that runs a few times a year; a call adds none.
    #
    # `needs:` is also what guarantees the ordering mcp-publisher requires — it reads the
    # `mcp-name:` token from the PUBLISHED PyPI README, so the wheel must be up first.
    # And the call runs against this TAG, so server.json is the released one.
    needs: build-and-publish
    # A pre-release must never become the registry's ACTIVE listing.
    if: needs.build-and-publish.outputs.prerelease != 'true'
    permissions:
      contents: read
      id-token: write # OIDC exchange with registry.modelcontextprotocol.io
    uses: ./.github/workflows/mcp-registry.yml
    with:
      version: ${{ github.ref_name }}
