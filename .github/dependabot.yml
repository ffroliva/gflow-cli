# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies.
  #
  # This MUST be "uv", not "pip". The "pip" ecosystem reads pyproject.toml only
  # and has no visibility into uv.lock — but every install path in this repo
  # (`uv sync`, CI, the release build) resolves from the LOCKFILE. The result
  # was a repo where no transitive dependency had ever received an update PR:
  # scan the Dependabot history before 2026-08 and every single PR is a direct
  # dev dep (ruff, patchright) or a GitHub Action. `cryptography` is pulled in
  # via browser-cookie3, appears nowhere in pyproject.toml, and so sat on a
  # version with a published CVE until the v0.50.0 release PR tripped pip-audit.
  # The "uv" ecosystem reads pyproject.toml AND uv.lock, so transitive pins
  # finally get bumped. See docs.astral.sh/uv/guides/integration/dependabot/.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    # These labels must EXIST before Dependabot can apply them. When they did
    # not, every bump PR opened with a bot comment reading "The following labels
    # could not be found: dependencies, python" and landed unlabelled, so
    # `label:dependencies` matched nothing. `.github/workflows/labels.yml` is
    # the source of truth that keeps them created — edit both together.
    labels:
      - "dependencies"
      - "python"
    groups:
      # Since the ecosystem became "uv", a bump PR is opened per LOCKED package
      # -- transitives included -- so a routine week resolves ~38 updates into a
      # queue five PRs wide. On 2026-08-04 that queue ate itself: #441/#442 were
      # opened, then closed unmerged by Dependabot ("Looks like aiohttp is
      # up-to-date now") because the CVE bumps they carried had already been
      # applied by hand in #443 while they waited behind the cap. Grouping makes
      # the week arrive as ONE reviewable PR that cannot be overtaken.
      #
      # Majors stay ungrouped deliberately: this cycle alone offered protobuf
      # 6 -> 7 and structlog 25 -> 26, and a breaking transitive must be able to
      # fail on its own rather than red-lighting the whole batch.
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # NOTE: security updates are intentionally NOT grouped. They are exempt from
    # `groups` unless a group sets `applies-to: security-updates`, so an advisory
    # fix still opens immediately on its own instead of waiting for Monday.
    ignore:
      # playwright MINORS must be ignored here. They are NOT gated by the
      # `<1.62.0` upper bound in pyproject.toml -- that was the assumption this
      # rule used to state, and PR #465 falsified it. The "uv" ecosystem does
      # not respect a constraint standing in an update's way, it REWRITES it:
      # #465 widened `playwright>=1.61.0,<1.62.0` to `<1.63.0` and locked
      # 1.62.0 -- the exact version observed hanging every `video i2v` right
      # after the frame upload (see the bound's comment in pyproject.toml).
      # Only tests/test_playwright_pin.py stopped it, and on its way out it
      # red-lighted the whole grouped weekly batch.
      #
      # PATCH bumps stay allowed on purpose: the 1.61.x headroom exists so a
      # driver CVE fix does not require a gflow release. Raising a MINOR is a
      # deliberate, live-verified act (AGENTS.md "verify before you act") and
      # also means hand-editing SUPPORTED_PLAYWRIGHT_RANGE in
      # src/gflow_cli/api/transports/ui_automation_video.py, which no bot can
      # do -- so a bot-authored minor bump can never be mergeable here anyway.
      # The weekly `deps-watch` workflow reports how far behind the pin has
      # drifted so it does not freeze unnoticed.
      - dependency-name: "playwright"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # patchright is the SAME hazard with a bigger blast radius, and the exact
      # `==` pin protects it no better than playwright's upper bound protected
      # playwright -- an exact pin is just another constraint for the "uv"
      # ecosystem to rewrite. It ships a PATCHED Chromium driver that loads the
      # real Google session (cookies, OAuth Bearer, SAPISID), so docs/SECURITY.md
      # requires every bump to get a security review and explicitly says it is
      # "NOT a routine dependabot auto-merge". That was prose with nothing
      # enforcing it; this is the enforcement. ALL update-types, patch included:
      # any version change moves the browser binary underneath the user.
      - dependency-name: "patchright"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    # Kept in sync with .github/workflows/labels.yml — see the note above.
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Actions majors are grouped too. Unlike Python transitives they are few,
      # uniform, and already reviewed as a batch in practice -- 2026-07-20 alone
      # opened four separate PRs (#352-#355) for what is one "bump the actions"
      # decision, including checkout 4 -> 7 on a workflow the earlier #196 had
      # already moved to 6.
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # npm — the PR-triage sandbox's pinned Claude Code CLI
  # (scripts/autopilot/package-lock.json, installed via `npm ci` in
  # Dockerfile.triage).
  - package-ecosystem: "npm"
    directory: "/scripts/autopilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"

  # Docker — the digest-pinned node:20-slim base of Dockerfile.triage.
  - package-ecosystem: "docker"
    directory: "/scripts/autopilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"

  # uv — the hash-pinned MkDocs set for the Pages build
  # (website/requirements.txt, compiled from website/requirements.in).
  # "uv", NOT "pip", for the same reason as the root entry: the pip ecosystem
  # would regenerate the file with pip-compile, clobbering the uv-authored
  # header/format; dependabot's uv ecosystem recompiles .in → .txt via
  # `uv pip compile` and keeps the hashes.
  - package-ecosystem: "uv"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
