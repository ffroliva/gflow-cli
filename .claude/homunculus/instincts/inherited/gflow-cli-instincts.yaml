# Gflow Cli Workflow Back Merge Release Into Develop

## Action

Follow the back-merge-release-into-develop workflow:
1. Merge main into develop after a release.
2. Resolve any merge conflicts.
3. Update versioned files (CHANGELOG.md, pyproject.toml, uv.lock, __init__.py).
4. Update or add documentation files as needed (README.md, AGENTS.md, docs/*, etc).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: CHANGELOG.md, pyproject.toml, src/gflow_cli/__init__.py

