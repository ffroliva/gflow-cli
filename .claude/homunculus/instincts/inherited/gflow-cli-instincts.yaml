# Gflow Cli Workflow Feature Development With Spec Plan And Tests

## Action

Follow the feature-development-with-spec-plan-and-tests workflow:
1. Write design spec(s) and implementation plan in docs/superpowers/specs/ and docs/superpowers/plans/
2. Update or add implementation code in src/gflow_cli/ (often multiple modules)
3. Add or update tests in tests/ (unit and e2e as needed)
4. Update documentation (docs/USAGE.md, docs/USER_GUIDE.md, docs/ARCHITECTURE.md, CHANGELOG.md, KNOWN_ISSUES.md, etc.)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: docs/superpowers/specs/*.md, docs/superpowers/plans/*.md, src/gflow_cli/**/*.py

