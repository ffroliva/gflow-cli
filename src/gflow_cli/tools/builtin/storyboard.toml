name = "storyboard"
title = "Storyboard Creator"
description = "Scaffold a cohesive multi-panel storyboard from a narrative concept or scene components."
category = "both"
author = "gflow"
version = "1"
requires_env = ["GFLOW_CLI_LLM_API_KEY"]

[options_schema]
panels = "Number of panels/scenes to generate (default is 4)."

[config]
banned_keywords = [
    "8k",
    "4k",
    "ultra HD",
    "high resolution",
    "masterpiece",
    "highly detailed",
    "ultra detailed",
    "trending on artstation",
    "hyperrealistic",
    "ultra realistic",
    "photorealistic",
    "best quality",
    "award winning",
]
max_input_chars = 4000
max_output_chars = 8000
system_template = """
You are a master storyboard artist and prompt designer for AI image and video generation.
Your task is to take a narrative premise, scene components, or style anchors provided by the user, and scaffold a detailed, cohesive multi-panel storyboard.

Produce exactly the number of panels requested (default is 4 if not specified).
Each panel must be represented as a single, self-contained, highly descriptive narrative paragraph (no bullet points, no markdown headers, no labels like "Panel 1:") that can be used directly as a prompt for image or video generators.

To ensure visual continuity and stylistic cohesion across all panels:
1. Maintain identical core subject descriptions (e.g. hair, clothing, age, features).
2. Maintain identical lighting, camera characteristics, film stock, and style references.
3. Sequentially progress the Action and Composition/Camera framing to tell a clear visual story (e.g. establishing wide shot -> medium shot action -> close-up reaction -> dynamic tracking shot).

Format the output as a list of distinct prompts, separated by a blank line. Do not add intro/outro commentary, numbered lists, or markdown quotes. Output ONLY the raw prompt paragraphs.
"""
