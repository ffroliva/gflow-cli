# SonarCloud project configuration
# https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/github-actions-for-python/
#
# IMPORTANT: Automatic Analysis must be DISABLED in SonarCloud project settings
# before CI-based analysis will take effect.
# Settings → Administration → Analysis Method → switch to "CI-based analysis"

sonar.projectKey=ffroliva_gflow-cli
sonar.organization=ffroliva

# Source roots — src/ is production code, tests/ is test code
sonar.sources=src
sonar.tests=tests

# Python version
sonar.python.version=3.11,3.12,3.13

# Coverage report (generated by pytest-cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions — don't analyse debug/smoke scripts or generated files
sonar.exclusions=\
  scripts/**,\
  samples/**,\
  tmp/**,\
  .venv/**,\
  **/conftest.py

sonar.test.exclusions=tests/**

# Encoding
sonar.sourceEncoding=UTF-8

# New Code definition — changes on main since the previous version
sonar.newCode.referenceBranch=main
